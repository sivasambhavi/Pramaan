# ── 3. DATA.GOV.IN API ────────────────────────────────────────────────────────
# API key setup:
#   1. Register at https://data.gov.in/user/register
#   2. Go to My Account → API Keys → Generate Key
#   3. Add to your .env file:  DATA_GOV_API_KEY=your_key_here
#
# The full dataset registry (with all UUIDs) is at:
#   data/config/govdata_registry.json
# Add new datasets there — this section mirrors only the ones actively used in transform.
#
# resource_id: the UUID from data.gov.in (find it at: data.gov.in → open dataset → API tab)
# api_endpoint: https://api.data.gov.in/resource/{resource_id}?api-key=YOUR_KEY&format=json
# filters_by_state: if true, transform.py loops over active states and filters records

govdata_api:
  base_url: "https://api.data.gov.in/resource"
  key_env_var: "DATA_GOV_API_KEY"          # variable name in .env file
  register_url: "https://data.gov.in/user/register"
  records_per_page: 200                    # max data.gov.in allows

govdata_sources:
  - name: "AMRUT Storm Water Drainage"
    resource_id: "6e38d0c0-045e-4dce-81d0-eca39519bb07"
    output_file: "amrut_storm_water_drainage.json"
    title: "State/UT-wise Status of AMRUT Storm-Water Drainage Projects (Dec 2021)"
    api_endpoint: "https://api.data.gov.in/resource/6e38d0c0-045e-4dce-81d0-eca39519bb07"
    filters_by_state: true
    state_field: "state_ut"
    active: true

  - name: "PMAY-Urban Housing Progress"
    resource_id: "65a47638-5f03-4c47-968f-63ccbac210f1"
    output_file: "pmay_housing_data.json"
    title: "State/UT-wise Houses Sanctioned/Grounded/Completed under PMAY-U (2020-25)"
    api_endpoint: "https://api.data.gov.in/resource/65a47638-5f03-4c47-968f-63ccbac210f1"
    filters_by_state: true
    state_field: "state_ut"
    active: true

  - name: "SBM Toilets Comprehensive"
    resource_id: "88801d21-6a04-485a-9d6a-5e844db67a61"
    output_file: "sbm_toilets_comprehensive.json"
    title: "State/UT-wise IHHL + CT/PT under SBM-Urban 2017-2022"
    api_endpoint: "https://api.data.gov.in/resource/88801d21-6a04-485a-9d6a-5e844db67a61"
    filters_by_state: true
    state_field: "state_ut"
    active: true

  - name: "AMRUT Funds CA Allocation"
    resource_id: "bf2b01ec-9ff6-4d37-a9e9-475a85e2e8f9"
    output_file: "amrut_funds.json"
    title: "State/UT-wise Central Assistance Allocation under AMRUT 2.0 (Jul 2022)"
    api_endpoint: "https://api.data.gov.in/resource/bf2b01ec-9ff6-4d37-a9e9-475a85e2e8f9"
    filters_by_state: true
    state_field: "states_ut"
    active: true

  - name: "AMRUT State CS Released"
    resource_id: "c1e13610-f726-4eed-9c9f-12217c49390e"
    output_file: "amrut_statewise_allocation.json"
    title: "State/UT-wise Central Share Released/Sanctioned under AMRUT 2.0 (2021-25)"
    api_endpoint: "https://api.data.gov.in/resource/c1e13610-f726-4eed-9c9f-12217c49390e"
    filters_by_state: true
    state_field: "state_ut"
    active: true

  - name: "PM SVANidhi Beneficiaries"
    resource_id: "9ecf4d59-ca75-44fb-8513-137f254880c3"
    output_file: "pm_svanidhi_beneficiaries.json"
    title: "State/UT-wise PM SVANidhi Beneficiaries 2020-24"
    api_endpoint: "https://api.data.gov.in/resource/9ecf4d59-ca75-44fb-8513-137f254880c3"
    filters_by_state: true
    state_field: "state_ut"
    active: true

  - name: "Ayushman Bharat PMJAY Cards"
    resource_id: "2029b46f-154e-4fb3-b5fb-2dde336e52c4"
    output_file: "ayushman_bharat_cards.json"
    title: "State/UT-wise Eligible Families and Ayushman Cards Issued under AB-PMJAY (Dec 2022)"
    api_endpoint: "https://api.data.gov.in/resource/2029b46f-154e-4fb3-b5fb-2dde336e52c4"
    filters_by_state: true
    state_field: "state_ut"
