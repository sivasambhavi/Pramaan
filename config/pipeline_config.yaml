    state_field: "state_ut"
    active: false                          # enable when transform reads this file


# ── 4. NEWS SEARCH QUERY TEMPLATES ───────────────────────────────────────────
# Used by scheduler.py for targeted news searches.
# {state}, {city}, {ward}, {scheme} are substituted at runtime.

news_query_templates:
  - "{scheme} {state} infrastructure completed"
  - "MCD {city} drain road repair {ward}"
  - "PMAY housing {state} beneficiary"
  - "Swachh Bharat toilet {city}"
  - "{ward} {city} civic work progress"


# ── 5. SEMI-STRUCTURED SOURCE FILES ───────────────────────────────────────────
# Files in data/resources/semi_structured/ that fetch_semi_structured.py reads.
# Add new state-level KML/xlsx files here.

semi_structured_sources:
  water_bodies:
    - file: "delhi_jal_dharohar_2023.kml"
      state: "DELHI"
      output: "water_bodies_delhi.json"
      active: true

  parks_roster:
    - file: "sh_north_zone_duty_roaster_*.xlsx"
      state: "DELHI"
      zone: "Shahdara North"
      output: "parks_roster_delhi_shahdara_north.json"
      active: true

  tenders:
    - file: "delhi_tenders_data.md"
      state: "DELHI"
      output: "tenders_delhi.json"
      active: true


# ── 6. UNSTRUCTURED PDF / DOC SOURCES ────────────────────────────────────────
# Files in data/resources/unstructured/pdfs/ and /docs/
# fetch_unstructured.py processes all files it finds in those dirs.
# Add new state PDFs by just dropping them in the folder — no config needed.
# This section is for documentation only.

unstructured_sources_note: >
  Drop any PDF/CSV/MD into data/resources/unstructured/pdfs/ or /docs/
  and run fetch_unstructured.py. It will auto-detect and extract.
  Files already extracted (have a matching .json in /extracted/) are skipped.
