    name: "Delhi"
    aliases: ["Delhi", "NCT of Delhi", "National Capital Territory of Delhi"]
    region_id: "REG_DELHI"
    bbox: [28.40, 28.90, 76.80, 77.40]
    active: true

  - id: "MAHARASHTRA"
