    url: "https://news.google.com/rss/search?q=MoHUA+urban+development+India+site:pib.gov.in&hl=en-IN&gl=IN&ceid=IN:en"
    tags: ["mohua", "urban", "amrut", "pmay", "swachh"]
    active: true
    verified: true                         # tested 2026-03-20, 100 entries

  - name: "Google News - AMRUT scheme (national)"
    url: "https://news.google.com/rss/search?q=AMRUT+scheme+India+municipal&hl=en-IN&gl=IN&ceid=IN:en"
