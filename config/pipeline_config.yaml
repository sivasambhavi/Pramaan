# ═══════════════════════════════════════════════════════════════════════════════
# PRAMAAN — Pipeline Configuration
# All scraping targets, state coverage, RSS feeds, and search queries live here.
# Add a new state/city/RSS feed by editing this file — no code changes needed.
# ═══════════════════════════════════════════════════════════════════════════════


# ── 1. ACTIVE STATES / UTs ────────────────────────────────────────────────────
# Add any Indian state or UT. The pipeline will fetch govdata for all of them.
# bbox: [lat_min, lat_max, lon_min, lon_max]  — used for coordinate validation

states:
