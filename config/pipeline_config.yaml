    note: "Delhi does not participate in AB-PMJAY (opted out) — no Delhi row in this dataset"

  - name: "AMRUT Waterlogging Eliminated"
    resource_id: "caadd339-a9a7-47bc-adbe-671bf57ad3fe"
    output_file: "amrut_waterlogging_eliminated.json"
